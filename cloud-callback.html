<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Finishing sign-in</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f6f7f4; color: #1d2418; }
  @media (prefers-color-scheme: dark) { body { background: #14170f; color: #e8ede2; } }
  p { margin: 16px; text-align: center; }
</style>
</head>
<body>
<p id="msg">Finishing sign-in… this window will close by itself.</p>
<script>
  // Sign-in return page for cloud backup in iNaturalistHighlights.html. It hands the provider's
  // reply (in the URL) back to the page that opened it, three ways, because some sign-in pages
  // cut the link to the opener window: postMessage, a BroadcastChannel, and localStorage.
  (function () {
    var data = { type: 'nd-cloud-auth', url: location.href };
    try { localStorage.setItem('nd_cloud_auth', JSON.stringify(data)); } catch (e) {}
    try { var bc = new BroadcastChannel('nd-cloud-auth'); bc.postMessage(data); bc.close(); } catch (e) {}
    try { if (window.opener) window.opener.postMessage(data, location.origin); } catch (e) {}
    // Scrub the code/token from this window's history entry and address bar.
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    setTimeout(function () {
      window.close();
      document.getElementById('msg').textContent = 'Signed in. You can close this window and return to iNaturalist Highlights.';
    }, 400);
  })();
</script>
</body>
</html>
